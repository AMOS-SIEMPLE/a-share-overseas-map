<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A 股出海质量图谱 · 企业出海决策支持系统</title>
<style>
/* ============ 基础 ============ */
:root{
  --ink:#1A2433; --ink2:#3D4859; --muted:#6B7A8F; --dim:#98A2B3;
  --line:#E3E8EF; --line2:#EDF0F4; --bg:#F6F8FB; --card:#FFFFFF;
  --blue:#2E86AB; --blue-d:#1F5F7E; --red:#C0392B; --green:#4A8B6F;
  --amber:#D68910;
  --shadow:0 1px 2px rgba(26,36,51,.05),0 4px 14px rgba(26,36,51,.05);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:14px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-weight:650;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:26px}h2{font-size:17px}h3{font-size:15px}
p{color:var(--ink2)}
b{font-weight:650}

/* ============ 顶栏 ============ */
header{
  position:sticky;top:0;z-index:50;
  background:rgba(255,255,255,.92); backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:1280px;margin:0 auto;padding:0 24px;
  display:flex;align-items:center;gap:28px;height:58px}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:26px;height:26px;border-radius:7px;
  background:linear-gradient(135deg,var(--blue) 0%,var(--blue-d) 100%);
  display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700}
.brand b{font-size:14.5px;letter-spacing:-.01em}
.brand span{font-size:11.5px;color:var(--dim);display:block;margin-top:-3px}
nav{display:flex;gap:2px;margin-left:auto;overflow-x:auto}
.tab{
  border:0;background:none;cursor:pointer;font:inherit;font-size:13.5px;
  color:var(--muted);padding:7px 13px;border-radius:8px;white-space:nowrap;
  transition:background .15s,color .15s;
}
.tab:hover{background:#EFF3F8;color:var(--ink2)}
.tab.on{background:var(--blue);color:#fff;font-weight:600}
.tab.enterprise.on{background:var(--blue-d)}
/* 「方法与数据」是抽屉入口，不是页签，用描边区分 */
.tab.meta{border:1px solid var(--line);background:#fff;margin-left:6px}
.tab.meta:hover{border-color:var(--blue);background:#F4F9FC;color:var(--blue)}
/* 「数据集下载」是外链，不用 .tab 类（避免被当成页签切换逻辑处理） */
.navdl{font-size:13.5px;color:var(--blue-d);text-decoration:none;font-weight:600;
  padding:7px 13px;border-radius:8px;border:1px dashed #9CC5D8;background:#F7FBFD;
  white-space:nowrap;transition:background .15s}
.navdl:hover{background:#E9F3F9}

/* ============ 布局 ============ */
main{max-width:1280px;margin:0 auto;padding:22px 24px 60px}
.hero{margin-bottom:18px}
.hero h1{margin-bottom:6px}
.hero .sub{color:var(--muted);font-size:13.5px;max-width:900px}
.hero.small h1{font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;box-shadow:var(--shadow)}
.kpi b{font-size:24px;font-weight:700;color:var(--blue-d);display:block;line-height:1.2;
  letter-spacing:-.02em}
.kpi b i{font-size:13px;font-style:normal;font-weight:600;margin-left:2px;color:var(--muted)}
.kpi span{font-size:12px;color:var(--muted);display:block;margin-top:3px}
.kpi.warn b{color:var(--amber)}
.kpi.hot b{color:var(--red)}

/* 首屏：年份切片器 */
.herotop{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap}
.yearbox{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ylab{font-size:11.5px;color:var(--dim);letter-spacing:.03em}
.ychips{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;
  background:#F0F3F8;padding:4px;border-radius:9px}
.ychip{border:0;background:none;font:inherit;font-size:12px;color:var(--muted);
  padding:4px 9px;border-radius:6px;cursor:pointer;transition:.12s;font-variant-numeric:tabular-nums}
.ychip:hover{background:#fff;color:var(--ink2)}
.ychip.on{background:var(--blue);color:#fff;font-weight:650}
.heronote{font-size:12.5px;color:var(--muted);margin-top:13px;
  padding:10px 14px;background:#FAFBFD;border:1px solid var(--line2);border-radius:9px}
.heronote b{color:var(--ink)}

/* ============ 卡片 ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-head{margin-bottom:12px}
.card-head p{font-size:12.8px;color:var(--muted);margin-top:5px;max-width:960px}
.card .hint{font-size:12.3px;color:var(--muted);margin-top:10px;line-height:1.62}
.card .hint.dim{color:var(--dim);font-size:11.8px}
.card .hint.warn-note{color:var(--amber);background:#FFF8E8;padding:8px 12px;border-radius:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.grid3.inner{gap:12px}
.grid2>.card,.grid3>.card{margin-bottom:0}
.grid2+.card,.grid3+.card{margin-top:16px}
.sub-h{font-size:13.5px;font-weight:650;color:var(--ink2);margin:18px 0 8px;
  padding-top:12px;border-top:1px solid var(--line2)}

/* ============ 指标切换器 ============ */
.switcher{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.sw{border:1px solid var(--line);background:#fff;font:inherit;font-size:12.5px;
  color:var(--ink2);padding:6px 13px;border-radius:20px;cursor:pointer;transition:.14s}
.sw:hover{border-color:var(--blue);color:var(--blue)}
.sw.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}

/* 行业/区域：左条形 + 右表 */
.indwrap,.provwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:22px;align-items:start}
.indbars{min-width:0}
.indtable{min-width:0}
.indbars rect{cursor:pointer}
.indtable tr.sel td{background:#F0F7FB}
.indtable tbody tr{cursor:pointer}
.indtable tbody tr:hover td{background:#F8FAFD}
.sectools{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.exportrow{display:flex;gap:7px;margin-top:12px;flex-wrap:wrap}
.xbtn{border:1px solid var(--line);background:#fff;font:inherit;font-size:11.8px;
  color:var(--muted);padding:5px 12px;border-radius:7px;cursor:pointer;transition:.14s}
.xbtn:hover{border-color:var(--blue);color:var(--blue);background:#F4F9FC}
.pickerrow{display:flex;align-items:center;gap:11px;margin-bottom:14px;flex-wrap:wrap}
.pickerrow label{font-size:12.5px;color:var(--muted)}
.pickerrow select{font:inherit;font-size:13px;padding:6px 11px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;min-width:180px}
.pickerrow select:focus{border-color:var(--blue)}

/* 对比条 */
.cmp2{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin-top:14px}
.cmp{background:#FAFBFD;border:1px solid var(--line2);border-radius:9px;padding:10px 13px}
.cmp span{display:block;font-size:11.5px;color:var(--dim)}
.cmp b{display:block;font-size:18px;font-weight:680;color:var(--ink);margin:2px 0;font-variant-numeric:tabular-nums}
.cmp i{font-style:normal;font-size:11.5px;color:var(--muted)}
.cmp i.up{color:var(--red);font-weight:600}
.cmp i.down{color:var(--green);font-weight:600}
.statline.wrap{flex-wrap:wrap}
.statline.wrap>div{min-width:104px}

/* ============ 图表 ============ */
/* overflow:visible 会让坐标超界的元素画到卡片外面（曾导致模拟轨迹的线串到下一张图），
   这里统一裁掉；但 axis 标签在 viewBox 内，不受影响 */
.chart{width:100%;height:auto;display:block;overflow:hidden}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;
  font-size:12px;color:var(--muted);align-items:center}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px}
.legend .dim{margin-left:auto;color:var(--dim);font-size:11.5px}
.warnbar{background:#FFF8E8;border:1px solid #F5E0B5;color:#8A6510;
  padding:10px 15px;border-radius:10px;font-size:12.5px;margin:10px 0}
.warnbar b{display:inline-block;margin-right:9px;padding:1px 8px;border-radius:5px;
  background:#F5E0B5;font-size:11.5px}
.warnbar.hard{background:#FDF0EE;border-color:#F0C4BE;color:#9C2B1E}
.warnbar.hard b{background:#F0C4BE;color:#9C2B1E}

/* ============ 表格 ============ */
.tablewrap{overflow-x:auto;margin-top:6px}
/* 折叠表：默认收起，点开才展开（大表信息量大但不是每页都需要看） */
.foldtable{margin-top:8px}
.foldtable summary{list-style:none;cursor:pointer;font-size:12.8px;color:var(--muted);
  padding:9px 12px;background:#FAFBFD;border:1px solid var(--line2);border-radius:9px;
  display:flex;align-items:center;gap:7px;transition:.14s;user-select:none}
.foldtable summary::-webkit-details-marker{display:none}
.foldtable summary::marker{content:""}
.foldtable summary::before{content:"▸";font-size:10px;color:var(--dim);transition:.14s;
  display:inline-block}
.foldtable[open] summary::before{transform:rotate(90deg)}
.foldtable summary:hover{border-color:var(--blue);color:var(--blue)}
.foldtable summary b{color:var(--ink);font-weight:600}
.foldtable[open] summary{margin-bottom:8px;background:#F4F9FC;border-color:#C9DFEC}
.foldtable[open] summary:hover{color:var(--blue)}
/* 提示文案随展开状态切换 */
.foldtable .fthint{font-style:normal}
.foldtable .fthint i{font-style:normal;font-size:11.8px;color:var(--dim)}
.foldtable .fthint .fo{display:none}
.foldtable[open] .fthint .fc{display:none}
.foldtable[open] .fthint .fo{display:inline}
/* 标题栏右侧的下载按钮：右对齐、点击不折叠 */
.foldtable summary .foldcsv{margin-left:auto;padding:4px 11px;font-size:11.5px}
.dt{width:100%;border-collapse:collapse;font-size:12.8px;font-variant-numeric:tabular-nums}
.dt th{text-align:center;padding:9px 8px;font-weight:600;color:var(--muted);
  border-bottom:1.5px solid var(--line);font-size:12px;white-space:nowrap;
  position:sticky;top:0;background:var(--card)}
.dt td{text-align:center;padding:8px;border-bottom:1px solid var(--line2);color:var(--ink2)}
.dt td.l{text-align:left;color:var(--ink);font-weight:500}
.dt tbody tr:hover{background:#F8FAFD}
.dt .up{color:var(--red);font-weight:600}
.dt .down{color:var(--green);font-weight:600}
.dim{color:var(--dim)}

/* ============ 企业卡 ============ */
.searchbox{display:flex;gap:9px;margin-top:16px;max-width:560px}
.searchbox input{
  flex:1;font:inherit;font-size:14px;padding:10px 15px;border-radius:10px;
  border:1.5px solid var(--line);background:#fff;color:var(--ink);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.searchbox input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,134,171,.12)}
.searchbox button{
  font:inherit;font-size:13.5px;font-weight:600;padding:10px 22px;border:0;
  border-radius:10px;background:var(--blue);color:#fff;cursor:pointer;transition:background .15s;
}
.searchbox button:hover{background:var(--blue-d)}
.quick{display:flex;gap:7px;align-items:center;margin-top:11px;flex-wrap:wrap;font-size:12px;color:var(--dim)}
.chip{border:1px solid var(--line);background:#fff;border-radius:20px;
  padding:4px 12px;font:inherit;font-size:12px;color:var(--ink2);cursor:pointer;transition:.15s}
.chip:hover{border-color:var(--blue);color:var(--blue);background:#F4F9FC}

.firm-head{display:flex;justify-content:space-between;align-items:flex-start;
  gap:20px;padding:4px 2px 16px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.firmhead-right{display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.firmhead-right .exportrow{margin-top:0}
.firm-head h2{font-size:22px;display:flex;align-items:baseline;gap:10px}
.firm-head .code{font-size:13px;color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}
.firm-head .meta{font-size:12.5px;color:var(--muted);margin-top:3px}
.verdict{display:flex;align-items:center;gap:7px;padding:8px 18px;border-radius:22px;
  font-size:14px;font-weight:650;white-space:nowrap}
.verdict .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.v0{background:#F0F2F5;color:#6B7A8F}
.v1{background:#FDF0EE;color:#C0392B}
.v2{background:#EBF4F9;color:#2E86AB}
.v3{background:#F0F2F5;color:#5A6675}
.v4{background:#EDF5F1;color:#4A8B6F}

.pbar{margin:14px 0}
.pbar-head{display:flex;justify-content:space-between;font-size:12.5px;
  color:var(--muted);margin-bottom:6px}
.pbar-head b{color:var(--ink2);font-weight:600}
.pbar-track{height:8px;background:#EEF2F7;border-radius:5px;position:relative;overflow:visible}
.pbar-fill{height:100%;background:linear-gradient(90deg,#7FB6CE,#2E86AB);border-radius:5px;
  transition:width .5s cubic-bezier(.2,.8,.2,1)}
.pbar-mark{position:absolute;top:-3px;width:1.5px;height:14px;background:#B9C2CF}
.pbar-note{font-size:11.5px;color:var(--dim);margin-top:5px}

.statline{display:flex;gap:0;margin-top:14px;border-top:1px solid var(--line2);
  border-bottom:1px solid var(--line2);flex-wrap:wrap}
.statline>div{flex:1;min-width:90px;padding:11px 8px;text-align:center;
  border-right:1px solid var(--line2)}
.statline>div:last-child{border-right:0}
.statline span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.statline b{font-size:16px;font-weight:680;font-variant-numeric:tabular-nums;color:var(--ink)}
.statline b.up{color:var(--red)}
.statline b.down{color:var(--green)}

.riskgauge{text-align:center;padding:10px 0 4px}
.riskgauge .gv{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.1}
.riskgauge .gl{font-size:12px;color:var(--muted);margin-top:2px}

.causes{list-style:none;margin-top:6px}
.causes li{display:flex;gap:12px;padding:11px 14px;background:#FAFBFD;
  border-left:3px solid var(--blue);border-radius:0 8px 8px 0;margin-bottom:9px}
.causes li b{flex:0 0 96px;font-size:12.5px;color:var(--blue-d)}
.causes li span{font-size:12.8px;color:var(--ink2);line-height:1.6}

.note-bar{background:#FFF8E8;border:1px solid #F5E0B5;color:#8A6510;
  padding:10px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}

.gatebar{margin-top:8px}
.grow{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.glabel{flex:0 0 42px;font-size:12px;color:var(--muted);text-align:right}
.gbar{flex:1;height:10px;background:#EEF2F7;border-radius:5px;position:relative}
.gbar i{position:absolute;top:-3px;width:3px;height:16px;background:var(--blue);
  border-radius:2px;transform:translateX(-1.5px)}
.grow.you .gbar i{background:var(--red);height:20px;top:-5px;width:4px}
.grow b{flex:0 0 34px;font-size:12.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.grow.you b{color:var(--red);font-weight:700}

.qbox{text-align:center;padding:16px 12px;background:#FAFBFD;border-radius:11px;
  border:1px solid var(--line2)}
.qbox.hl{background:#F4F9FC;border-color:#CFE3EE}
.qbox b{font-size:30px;font-weight:700;color:var(--blue-d);display:block;line-height:1.15;
  letter-spacing:-.02em}
.qbox span{font-size:12px;color:var(--muted);display:block;margin-top:2px;font-weight:600}
.qbox p{font-size:11.3px;color:var(--dim);margin-top:7px;line-height:1.55}

.steps{list-style:none;counter-reset:s}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 40px;
  border-bottom:1px solid var(--line2);font-size:13px;color:var(--ink2);line-height:1.65}
.steps li:last-child{border-bottom:0}
.steps li::before{content:counter(s);position:absolute;left:0;top:12px;
  width:24px;height:24px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:12px;font-weight:700;display:grid;place-items:center}

.insight{background:linear-gradient(180deg,#FBFDFF 0%,#F5F9FC 100%);
  border-color:#D8E6EF}
.insight ol{margin:8px 0 0 20px}
.insight li{font-size:13.2px;color:var(--ink2);line-height:1.72;margin-bottom:11px}
.insight li b{color:var(--ink)}
.insight li:last-child{margin-bottom:0}
.insight p{font-size:13.2px;color:var(--ink2);line-height:1.72;margin-bottom:10px}
.insight p:last-child{margin-bottom:0}

/* ============ 风险两层 ============ */
.risk2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.risklayer{border-left:2px solid var(--line2);padding-left:16px}
.risklayer:first-child{border-left-color:#2E86AB}
.risklayer:last-child{border-left-color:#D68910}
.riskgauge .gv i{font-style:normal;font-weight:600;color:var(--muted);margin-left:1px}

/* ============ 规则层清单 ============ */
.rulelist{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.rulehit{display:flex;gap:12px;align-items:flex-start;padding:10px 13px;
  background:#FAFBFD;border-radius:0 9px 9px 0;border-left:3px solid var(--line)}
.rulehit.on{background:#FDF6F5;border-left-color:#C0392B}
.rulehit.off{opacity:.72}
.rmark{flex:0 0 44px;font-size:11px;font-weight:700;text-align:center;
  padding:2px 0;border-radius:5px;margin-top:1px}
.rulehit.on .rmark{background:#F5D6D1;color:#9C2B1E}
.rulehit.off .rmark{background:#EAEEF3;color:var(--muted)}
.rulehit b{display:block;font-size:13px;color:var(--ink);margin-bottom:3px}
.rulehit b i{font-style:normal;font-size:11px;color:var(--dim);font-weight:500;
  margin-left:7px;padding:1px 6px;background:#F0F3F8;border-radius:4px}
.rulehit p{font-size:12.3px;color:var(--ink2);line-height:1.6}

/* ============ 压力测试 ============ */
.stresshead{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;
  margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--line2)}
.stresshead>div{text-align:center}
.stresshead span{display:block;font-size:11.5px;color:var(--dim);margin-bottom:3px}
.stresshead b{font-size:17px;font-weight:680;color:var(--ink);font-variant-numeric:tabular-nums}
.stresshead b.down{color:var(--green)}

/* ============ 止损规则 ============ */
.rules{list-style:none;counter-reset:rl;margin-top:6px}
.rules li{counter-increment:rl;position:relative;padding:13px 0 13px 40px;
  border-bottom:1px solid var(--line2)}
.rules li:last-child{border-bottom:0}
.rules li::before{content:counter(rl);position:absolute;left:0;top:13px;
  width:24px;height:24px;border-radius:50%;background:var(--red);color:#fff;
  font-size:12px;font-weight:700;display:grid;place-items:center}
/* 只对「直接子元素」的标题加 block：正文里嵌套的 <b>（如 "4.12%"）
   如果也被设成 block，会独占一行把句子拆散 */
.rules li > b{display:block;font-size:13.5px;color:var(--ink);margin-bottom:6px}
.rules li p{font-size:12.8px;color:var(--ink2);line-height:1.68}
.rules li p b{color:var(--ink);font-weight:680;white-space:nowrap}
.ruledetail{margin-top:8px;padding:9px 13px;background:#FAFBFD;border-radius:8px;
  font-size:12.3px;color:var(--muted);line-height:1.65}

/* ============ 一键总结 ============ */
.summary{background:linear-gradient(180deg,#FBFDFF 0%,#F2F8FC 100%);border-color:#D3E3EE}
.sumlist{list-style:none;margin-top:8px}
.sumlist li{font-size:13.2px;color:var(--ink2);line-height:1.75;margin-bottom:9px;
  padding-left:16px;position:relative}
.sumlist li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;
  border-radius:50%;background:var(--blue)}
.sumlist li:last-child{margin-bottom:0}
.sumlist li b{color:var(--ink)}

/* ============ 模型可信度 ============ */
.cred{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-top:14px}
.creditem{background:#FAFBFD;border:1px solid var(--line2);border-radius:10px;padding:12px 14px}
.creditem b{display:block;font-size:16px;color:var(--blue-d);font-weight:680}
.creditem span{display:block;font-size:11.5px;color:var(--amber);margin:2px 0 6px;font-weight:600}
.creditem p{font-size:12.2px;color:var(--ink2);line-height:1.62}

/* ============ v3：判定三档标尺 ============ */
.vscale{background:#FAFBFD;border:1px solid var(--line2);border-radius:12px;
  padding:12px 16px 13px;min-width:296px}
.vscale.off{background:#F5F6F8}
.vscale-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.vscale-label{font-size:11.5px;color:var(--dim)}
.vscale-val{font-size:19px;font-weight:700;letter-spacing:-.01em}
.vscale-track{position:relative;height:38px;margin:0 6px}
.vscale-track::before{content:"";position:absolute;left:0;right:0;top:9px;height:4px;
  border-radius:3px;background:linear-gradient(90deg,#4A8B6F 0%,#4A8B6F 33%,#DCE7EE 33%,#DCE7EE 66%,#F3D6D2 66%,#F3D6D2 100%)}
.vtick{position:absolute;top:0;transform:translateX(-50%);text-align:center;white-space:nowrap}
.vtick i{display:block;width:9px;height:9px;border-radius:50%;margin:6px auto 0;
  border:2px solid #fff;box-shadow:0 0 0 1px rgba(26,36,51,.12)}
.vtick em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:20px}
/* 指针只占上半区，标签在下半区，两者不打架 */
.vmark{position:absolute;top:0;transform:translateX(-50%);width:2px;height:18px;
  background:#1A2433;border-radius:2px;z-index:2}
.vmark::after{content:"";position:absolute;left:50%;top:-4px;transform:translateX(-50%);
  border-left:5px solid transparent;border-right:5px solid transparent;border-top:6px solid #1A2433}
.vscale-why{font-size:11.8px;color:var(--muted);line-height:1.6;margin-top:10px;
  padding-top:9px;border-top:1px dashed var(--line2)}

/* ============ v3：定位图下方的行业体检卡 ============ */
.poscard{margin-top:16px;padding:16px 18px;background:linear-gradient(180deg,#FBFDFF 0%,#F4F9FC 100%);
  border:1px solid #D3E3EE;border-radius:12px}
.poscard-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.poscard-head h3{font-size:15.5px}
.poscard .statline{margin-top:10px}
.indtrend{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line2)}
.sub-h{font-size:13px;color:var(--ink);font-weight:600;margin-bottom:10px}

/* ============ v3：止损规则两行式 ============ */
/* 注意：标题用 .rules li > b（直接子元素），正文里嵌套的 <b> 不能设 block，
   否则 "4.12%" 这类片段会独占一行把句子拆散 */
.rules li p.rcond{font-size:12.6px;color:var(--ink2);line-height:1.62;margin-bottom:4px}
.rules li p.ract{font-size:12.6px;color:var(--muted);line-height:1.62}
.rules li p.ract::before{content:"→ ";color:var(--blue);font-weight:700}
.rules li{padding:12px 0 12px 40px}

/* ============ v5：首屏问题模块（问题更具体 + 结论紧跟） ============ */
.qline .qc{display:block;margin-top:7px;padding-top:7px;border-top:1px dashed var(--line2);
  font-size:12.3px;color:var(--ink2);line-height:1.6}
.qline .qc b{color:var(--blue-d);font-weight:680;font-variant-numeric:tabular-nums}
.qline .qc .qcnum{color:var(--ink);font-weight:700}

/* ============ v5：预测模块 ============ */
.fcgrid{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:start}
.fcgrid>.card{margin-bottom:0}
.fchead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  flex-wrap:wrap;margin-bottom:10px}
.fchead h3{font-size:15.5px}
.fcbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  color:var(--muted);background:#F0F3F8;border:1px solid var(--line2);border-radius:20px;padding:2px 10px}
.fcbadge.warn{color:#8A6510;background:#FFF8E8;border-color:#F5E0B5}
.fcbadge.ok{color:#3E7D62;background:#EDF5F1;border-color:#CBE3D8}
/* 预测图例 */
.fclegend{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:11.8px;color:var(--muted)}
.fclegend span{display:inline-flex;align-items:center;gap:6px}
.fclegend i{width:16px;height:0;border-top-width:2.5px;border-top-style:solid;display:inline-block}
.fclegend i.band{height:10px;border:0;background:rgba(46,134,171,.16);border-radius:2px}
.fclegend i.dash{border-top-style:dashed}
/* 情景表 */
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.scenbox{border:1px solid var(--line2);border-radius:10px;padding:11px 13px;background:#FAFBFD}
.scenbox .sn{font-size:11.8px;font-weight:650;color:var(--muted);display:flex;align-items:center;gap:6px}
.scenbox .sn i{width:8px;height:8px;border-radius:50%;display:inline-block}
.scenbox b{display:block;font-size:17px;font-weight:700;color:var(--ink);margin:5px 0 1px;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.scenbox em{font-style:normal;font-size:11.2px;color:var(--dim);display:block;line-height:1.5}
/* 回测卡 */
.btgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.btbox{background:#FAFBFD;border:1px solid var(--line2);border-radius:10px;padding:11px 13px}
.btbox span{font-size:11.4px;color:var(--dim);display:block;margin-bottom:4px}
.btbox b{display:block;font-size:18px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.btbox.best b{color:var(--green)}
.btbox i{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:2px}
.honest{background:#FFF8E8;border:1px solid #F5E0B5;color:#8A6510;border-radius:9px;
  padding:9px 13px;font-size:12.2px;line-height:1.65;margin-top:12px}
.honest b{color:#6E5209}
/* 退出概率条 */
.exitp{display:flex;flex-direction:column;gap:9px;margin-top:10px}
.exitrow{display:grid;grid-template-columns:64px 1fr 74px;gap:10px;align-items:center}
.exitrow .el{font-size:12px;color:var(--muted)}
.exitrow .eb{height:9px;background:#EEF2F7;border-radius:5px;overflow:hidden}
.exitrow .eb i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#D68910,#C0392B)}
.exitrow .ev{font-size:12.5px;font-weight:650;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
/* 2025 增量条 */
.y25{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.y25tag{font-size:11px;font-weight:700;color:#fff;background:linear-gradient(135deg,#2E86AB,#1F5F7E);
  border-radius:5px;padding:2px 8px;letter-spacing:.02em}
.y25item{font-size:12.2px;color:var(--ink2);background:#F4F9FC;border:1px solid #D3E3EE;
  border-radius:7px;padding:5px 11px}
.y25item b{color:var(--ink);font-weight:680;font-variant-numeric:tabular-nums}

/* ============ v5：自采数据集说明卡 ============ */
.selfdata{background:linear-gradient(180deg,#FBFDFF 0%,#F4F9FC 100%);border-color:#D3E3EE}
.selfdata .sdgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));
  gap:10px;margin-top:10px}
.selfdata .sdbox{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:10px 12px}
.selfdata .sdbox span{display:block;font-size:11.3px;color:var(--dim);margin-bottom:3px}
.selfdata .sdbox b{font-size:16px;font-weight:700;color:var(--blue-d);font-variant-numeric:tabular-nums}
.selfdata .sdbox i{font-style:normal;font-size:11px;color:var(--muted);display:block;margin-top:2px}
.filerow{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.filerow a,.filerow span.fx{display:inline-flex;align-items:center;gap:6px;font-size:12px;
  color:var(--blue-d);background:#EAF3F8;border:1px solid #CFE3EE;border-radius:7px;
  padding:6px 12px;text-decoration:none;font-weight:600}
.filerow a:hover{background:#DCEBF4}
.filerow a .fz{font-weight:400;color:#5C7C91;font-size:11px;margin-left:2px}
.filerow a:hover .fz{color:var(--blue-d)}
.dlbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px;
  padding:10px 12px;background:#F4F9FC;border:1px solid #DCE7EE;border-radius:8px}
.dlbar b{font-size:12px;color:var(--blue-d)}
.dlbar a{font-size:12px;color:var(--blue);text-decoration:none;font-weight:600;
  border-bottom:1px dotted #9CC5D8}
.dlbar a:hover{color:var(--blue-d)}

@media (max-width:1080px){
  .fcgrid{grid-template-columns:1fr}
  .scen{grid-template-columns:1fr}
}
@media (max-width:720px){
  .fcgrid{grid-template-columns:1fr}
  .scen{grid-template-columns:1fr}
  .exitrow{grid-template-columns:52px 1fr 62px}
  .btgrid{grid-template-columns:repeat(2,1fr)}
}

.empty{padding:40px;text-align:center;color:var(--dim);font-size:13.5px}

/* ============ v4：首屏叙事 ============ */
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;
  color:var(--blue-d);background:#EAF3F8;border:1px solid #CFE3EE;border-radius:20px;
  padding:3px 11px;letter-spacing:.02em;margin-bottom:9px}
.eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--blue);font-style:normal}
.qline{display:flex;gap:0;margin-top:14px;background:#fff;border:1px solid var(--line);
  border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.qline>div{flex:1;padding:12px 16px;border-right:1px solid var(--line2);min-width:0}
.qline>div:last-child{border-right:0}
.qline .qn{font-size:11px;font-weight:700;color:var(--blue);letter-spacing:.06em;
  display:block;margin-bottom:3px}
.qline .qt{font-size:13.2px;color:var(--ink);font-weight:600;line-height:1.45;display:block}
.qline .qa{font-size:11.8px;color:var(--muted);display:block;margin-top:4px;line-height:1.5}
.findings{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}
.find{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:15px 17px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.find::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--blue)}
.find.f2::before{background:var(--red)}
.find.f3::before{background:var(--green)}
.find .fh{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.find .fnum{font-size:22px;font-weight:720;letter-spacing:-.02em;color:var(--ink);
  font-variant-numeric:tabular-nums;line-height:1.1}
.find .fnum i{font-size:12px;font-style:normal;font-weight:600;color:var(--muted);margin-left:2px}
.find .ftag{font-size:11px;color:var(--dim)}
.find .ft{font-size:12.8px;color:var(--ink2);line-height:1.62}
.find .ft b{color:var(--ink);font-weight:680}
.guide{margin-top:14px;background:linear-gradient(180deg,#FBFDFF 0%,#F3F8FC 100%);
  border:1px solid #D3E3EE;border-radius:12px;padding:13px 17px}
.guide-h{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:680;
  color:var(--blue-d);margin-bottom:11px;flex-wrap:wrap}
.guide-h em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted);
  background:#fff;border:1px solid #CFE3EE;border-radius:20px;padding:1px 9px}
.gsteps{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gstep{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;cursor:pointer;transition:.15s;text-align:left;
  font:inherit;width:100%}
.gstep:hover{border-color:var(--blue);box-shadow:0 2px 10px rgba(46,134,171,.12);
  transform:translateY(-1px)}
.gstep .gn{flex:0 0 21px;height:21px;border-radius:50%;background:var(--blue);color:#fff;
  font-size:11.5px;font-weight:700;display:grid;place-items:center;margin-top:1px}
.gstep b{display:block;font-size:12.8px;color:var(--ink);font-weight:640;margin-bottom:2px}
.gstep span{display:block;font-size:11.6px;color:var(--muted);line-height:1.5}
.gstep .gar{margin-left:auto;color:var(--dim);font-size:13px;align-self:center}

/* ============ v4：方法与数据抽屉 ============ */
body.drawer-open{overflow:hidden}
.mdrawer{position:fixed;inset:0;z-index:200;display:none}
.mdrawer.on{display:block}
.mdrawer-bg{position:absolute;inset:0;background:rgba(20,29,42,.42);
  backdrop-filter:blur(2px);animation:mfade .2s ease}
@keyframes mfade{from{opacity:0}to{opacity:1}}
.mdrawer-panel{position:absolute;top:0;right:0;bottom:0;width:min(760px,94vw);
  background:var(--bg);box-shadow:-8px 0 40px rgba(20,29,42,.16);
  display:flex;flex-direction:column;animation:mslide .26s cubic-bezier(.2,.8,.2,1)}
@keyframes mslide{from{transform:translateX(28px);opacity:.6}to{transform:none;opacity:1}}
.mdrawer-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:16px 22px;background:#fff;border-bottom:1px solid var(--line)}
.mdrawer-head h2{font-size:16px}
.mdrawer-head p{font-size:11.8px;color:var(--muted);margin-top:1px}
.mdrawer-close{margin-left:auto;border:1px solid var(--line);background:#fff;font:inherit;
  font-size:12.5px;color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;
  transition:.14s;flex-shrink:0}
.mdrawer-close:hover{border-color:var(--blue);color:var(--blue);background:#F4F9FC}
.mdrawer-body{flex:1;overflow-y:auto;padding:18px 22px 40px;-webkit-overflow-scrolling:touch}
.mdrawer-body .card{padding:16px 18px;margin-bottom:13px}
.mdrawer-body h3{font-size:14px;margin-bottom:9px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mdrawer-body h3 em{font-style:normal;font-size:10.5px;font-weight:600;color:var(--muted);
  background:#EEF2F7;border-radius:5px;padding:1px 7px}
.mtable{width:100%;border-collapse:collapse;font-size:12.4px;margin-top:4px}
.mtable th{text-align:left;padding:8px 9px;font-weight:600;color:var(--muted);font-size:11.5px;
  border-bottom:1.5px solid var(--line);white-space:nowrap}
.mtable td{padding:9px;border-bottom:1px solid var(--line2);color:var(--ink2);
  vertical-align:top;line-height:1.55}
.mtable td b{color:var(--ink);font-weight:640}
.mtable td.mnum{font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:640;color:var(--ink)}
.mtable tr:last-child td{border-bottom:0}
.mtag{display:inline-block;font-size:10.5px;font-weight:600;border-radius:4px;
  padding:1px 6px;margin-top:3px;white-space:nowrap}
/* 第一列（环节名 + 类别标签）不能被压成竖排 */
.mtable td:first-child{min-width:104px}
.mtable td:first-child b{display:inline-block;white-space:nowrap}
.mtag.s{background:#EAEEF3;color:var(--muted)}
.mtag.g{background:#EDF5F1;color:#3E7D62}
.mtag.a{background:#FFF6E5;color:#8A6510}
.deflist{display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.4px;
  margin-top:4px;align-items:baseline}
.deflist dt{color:var(--muted);font-weight:600;white-space:nowrap}
.deflist dd{color:var(--ink2);line-height:1.6}
.deflist dd b{color:var(--ink)}
.bounds{list-style:none;margin-top:2px}
.bounds li{font-size:12.4px;color:var(--ink2);line-height:1.62;padding:7px 0 7px 20px;
  position:relative;border-bottom:1px solid var(--line2)}
.bounds li:last-child{border-bottom:0}
.bounds li::before{content:"!";position:absolute;left:0;top:8px;width:14px;height:14px;
  border-radius:50%;background:#FFF6E5;color:#8A6510;font-size:10px;font-weight:700;
  display:grid;place-items:center}
.bounds li b{color:var(--ink)}

/* ============ v4：企业对比 ============ */
.cmpbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.cmpbar input{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;
  border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;width:190px}
.cmpbar input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,134,171,.1)}
.cmpbar .xbtn{padding:7px 14px}
.cmpchips{display:flex;gap:7px;flex-wrap:wrap}
.cmpchip{display:inline-flex;align-items:center;gap:7px;background:#EAF3F8;
  border:1px solid #CFE3EE;border-radius:20px;padding:4px 8px 4px 12px;font-size:12.2px;
  color:var(--blue-d);font-weight:600}
.cmpchip em{font-style:normal;font-size:10.5px;color:var(--muted);font-weight:500}
.cmpchip button{border:0;background:none;cursor:pointer;color:var(--dim);font-size:14px;
  line-height:1;padding:0 2px}
.cmpchip button:hover{color:var(--red)}
.cmptable{width:100%;border-collapse:collapse;font-size:12.6px;
  font-variant-numeric:tabular-nums;margin-top:6px}
.cmptable th,.cmptable td{padding:9px 10px;border-bottom:1px solid var(--line2);text-align:center}
.cmptable th{font-size:11.8px;color:var(--muted);font-weight:600;border-bottom:1.5px solid var(--line)}
.cmptable th.l,.cmptable td.l{text-align:left;color:var(--muted);font-weight:600;white-space:nowrap}
.cmptable td b{font-size:14px;color:var(--ink);font-weight:680}
.cmptable td .u{color:var(--red);font-weight:600}
.cmptable td .d{color:var(--green);font-weight:600}
.cmptable tr.best td{background:#F4F9FC}
.cmptable .vbadge{display:inline-block;font-size:11px;font-weight:640;border-radius:5px;
  padding:2px 9px}
.cmpscroll{overflow-x:auto}

/* ============ v4：数据质量热力图 ============ */
.heatwrap{overflow-x:auto;margin-top:8px;padding-bottom:6px}
.heat{display:block;min-width:640px}
.heatlegend{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:11.5px;
  color:var(--muted);flex-wrap:wrap}
.heatlegend .bar{width:120px;height:9px;border-radius:5px;
  background:linear-gradient(90deg,#F2F5F8 0%,#CFE0EA 35%,#7FB6CE 70%,#2E86AB 100%)}
.heatlegend .bar i{display:block;height:100%;border-radius:5px}

/* ============ v4：样本漏斗 ============ */
.funnel{margin-top:10px}
.fstep{display:grid;grid-template-columns:126px 1fr;gap:9px 10px;align-items:start;margin-bottom:9px}
.fstep .fl{color:var(--muted);font-weight:600;font-size:11.9px;text-align:right;
  line-height:1.3;padding-top:5px}
.fstep .fl em{display:block;font-style:normal;font-size:10.2px;color:var(--dim);
  font-weight:500;margin-top:3px;line-height:1.35}
.fstep .fbar{height:24px;border-radius:5px;background:linear-gradient(90deg,#2E86AB,#5AA7C4);
  display:flex;align-items:center;justify-content:flex-end;padding:0 9px;min-width:54px;
  color:#fff;font-size:11.6px;font-weight:640;font-variant-numeric:tabular-nums;
  transition:width .35s ease;white-space:nowrap}
.fstep.f2 .fbar{background:linear-gradient(90deg,#4A6FA5,#7E9BC4)}
.fstep.f3 .fbar{background:linear-gradient(90deg,#7B61A8,#A08FC4)}
.fstep.f4 .fbar{background:linear-gradient(90deg,#8A99A8,#B4BFCA)}
.fstep .fn{font-size:10.8px;color:var(--dim);margin-top:4px;line-height:1.4}
.funote{font-size:12px;color:var(--muted);line-height:1.7;margin-top:10px;
  padding-top:10px;border-top:1px solid var(--line2)}

/* ============ v4：对比表当前列 ============ */
.cmptable th.foc{color:var(--blue-d);background:#F4F9FC;border-bottom-color:#9CC5D8}
.cmptable td.foc{background:#F7FBFD}
.cmptable tr:last-child td{border-bottom:0}
.cmptable td.l em{display:block;font-style:normal;font-size:10.5px;color:var(--dim);
  font-weight:500;white-space:normal;line-height:1.4;margin-top:1px}
.cmpfoot{font-size:11.6px;color:var(--dim);line-height:1.7;margin-top:9px}
.cmpfoot b{color:var(--muted)}
